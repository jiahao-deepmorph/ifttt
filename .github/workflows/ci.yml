name: CI
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go test -race -cover ./...
      - run: go vet ./...
      - name: Fuzz annotation scanners
        if: runner.os == 'Linux'
        run: go test ./internal/lint -run '^$' -fuzz '^FuzzParse$' -fuzztime=15s -parallel=2
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test Action launcher
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Dogfood the checker
        if: github.event_name == 'pull_request'
        run: go run ./cmd/ifttt check --github
  minimum-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
