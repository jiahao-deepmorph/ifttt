version: 2
project_name: ifttt
builds:
  - main: ./cmd/ifttt
    binary: ifttt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  - formats: [tar.gz]
    name_template: 'ifttt_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
